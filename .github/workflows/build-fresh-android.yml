name: 'Build Fresh Android'

# Android is built on Linux on purpose: deploy/build.sh and the native deps
# (libxray, awg-android) are bash/Makefile based and do not build on Windows.
on:
  workflow_dispatch:
  push:
    branches:
      - android-build-2026-07

jobs:
  Build-Android:
    if: github.repository_owner == 'fr3shsmoke-ux' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      QT_VERSION: 6.10.1
      NDK_VERSION: 27.2.12479018

    steps:
    - name: 'Get sources'
      uses: actions/checkout@v4
      with:
        submodules: 'true'
        fetch-depth: 10

    - name: 'Setup Java'
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 'Setup Android SDK'
      uses: android-actions/setup-android@v3

    - name: 'Install NDK and platform'
      run: |
        sdkmanager --install "ndk;${NDK_VERSION}" "platforms;android-36" "build-tools;36.0.0"
        echo "ANDROID_NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> $GITHUB_ENV

    - name: 'Install Qt (linux host tools)'
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ env.QT_VERSION }}
        host: 'linux'
        target: 'desktop'
        arch: 'linux_gcc_64'
        modules: 'qtremoteobjects qt5compat qtshadertools'
        dir: ${{ runner.temp }}
        setup-python: 'false'

    - name: 'Install Qt (android arm64)'
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ env.QT_VERSION }}
        host: 'linux'
        target: 'android'
        arch: 'android_arm64_v8a'
        modules: 'qtremoteobjects qt5compat qtshadertools'
        dir: ${{ runner.temp }}
        setup-python: 'false'

    # arm64-v8a covers real phones; x86_64 is what an emulator runs on.
    # Qt finds sibling ABI kits next to the first one, so both must be here.
    - name: 'Install Qt (android x86_64)'
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ env.QT_VERSION }}
        host: 'linux'
        target: 'android'
        arch: 'android_x86_64'
        modules: 'qtremoteobjects qt5compat qtshadertools'
        dir: ${{ runner.temp }}
        setup-python: 'false'

    - name: 'Setup python'
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: 'Install conan'
      run: |
        pip install "conan==2.28.0"
        conan profile detect --force

    - name: 'Install system packages'
      run: sudo apt-get update && sudo apt-get install -y ninja-build libsecret-1-dev

    # The persistent release key lives in repo secrets (ANDROID_KEYSTORE_BASE64,
    # ANDROID_KEYSTORE_PASSWORD). Decode it to a file for androiddeployqt to sign
    # with. Fail loudly if the secret is missing rather than silently shipping an
    # unsigned or throwaway-signed APK.
    - name: 'Restore release signing key'
      env:
        KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      run: |
        if [ -z "$KS_B64" ]; then
          echo "ANDROID_KEYSTORE_BASE64 secret is empty - cannot sign"; exit 1
        fi
        echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/fresh-release.jks"
        ls -l "$RUNNER_TEMP/fresh-release.jks"

    - name: 'Build APK'
      shell: bash
      env:
        QT_INSTALL_DIR: ${{ runner.temp }}
        QT_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/fresh-release.jks
        QT_ANDROID_KEYSTORE_ALIAS: fresh
        QT_ANDROID_KEYSTORE_STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        QT_ANDROID_KEYSTORE_KEY_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      run: deploy/build.sh --target android --abi arm64-v8a --abi x86_64 --sign

    - name: 'Show what was produced'
      if: ${{ always() }}
      shell: bash
      run: find . -name '*.apk' -o -name '*.aab' | head -20

    - name: 'Verify the APK is signed'
      shell: bash
      run: |
        set -e
        APK=$(find . -name 'FreshVPN.apk' | head -1)
        echo "apk: $APK"
        ls -lh "$APK"
        BT=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)
        "$BT/apksigner" verify --print-certs "$APK"
        echo "--- native ABIs inside the apk ---"
        unzip -l "$APK" | grep -o 'lib/[^/]*' | sort -u
        for want in arm64-v8a x86_64; do
          unzip -l "$APK" | grep -q "lib/$want/" || { echo "MISSING ABI: $want"; exit 1; }
        done
        echo "APK_PATH=$APK" >> $GITHUB_ENV

    - name: 'Publish APK to a release'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: android-test-latest
        name: Fresh VPN Android (test build)
        body: |
          Test build from `${{ github.sha }}`.
          Signed with a throwaway key generated in CI - install fresh, do not
          expect in-place updates between builds.
        files: ${{ env.APK_PATH }}
        prerelease: true